# CAPT on BiomedCLIP for RETINA.
# The DATALOADER / INPUT / MODEL / OPTIM blocks are copied verbatim from
# configs/trainers/BiomedCoOp/base_to_novel/retina.yaml so that CAPT and
# BiomedCoOp share IDENTICAL preprocessing, resize/crop, normalization, batch
# sizes, backbone and training schedule. Only TRAINER differs.
DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.001
  MAX_EPOCH: 50
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  CAPT:
    CTX_INIT: "a photo of a"
    N_CTX: 4
    PREC: "fp32"
    K_PAIRS: 1          # RETINA base has 2 classes -> at most 1 confusion partner
    ALPHA_S: 5.0
    ALPHA_GAMMA: 0.5
    MGDE_TOPK: 2
    BETA: 0.1
    CONF_LAMBDA: 1.0
